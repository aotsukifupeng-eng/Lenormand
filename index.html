    <h1>雷諾曼卡線上占卜系統</h1>
    <p>請在心中默想您的問題，選擇對應的主題，系統將為您抽出三張牌（過去、現在、未來/發展）。</p>

            <option value="overall">整體運勢 (綜合解析)</option>
            <option value="love">愛情與關係</option>
            <option value="work">工作與事業</option>
            <option value="health">健康與身心</option>
        </select>
        <button onclick="drawThreeCards()">抽三張牌</button>
    </div>

    <div id="resultArea" class="card-container">
        <!-- 抽牌結果將動態顯示於此 -->
    </div>

        function drawThreeCards() {
            const theme = document.getElementById('themeSelect').value;
            const resultArea = document.getElementById('resultArea');
            resultArea.innerHTML = ''; // 清空畫面

            // 將牌堆打亂 (Fisher-Yates 隨機洗牌演算法)
            let deck = [...lenormandDeck];
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }

            // 取出前三張牌
            const drawnCards = deck.slice(0, 3);
            const positions = ["第一張 (過去 / 起因)", "第二張 (現在 / 核心)", "第三張 (未來 / 發展)"];

            // 根據選擇的主題生成 HTML
            drawnCards.forEach((card, index) => {
                
                // 決定要顯示的主題內容
                let themeTitle = "";
                let themeText = "";
                
                switch(theme) {
                    case "love":
                        themeTitle = "💕 愛情解析";
                        themeText = card.love;
                        break;
                    case "work":
                        themeTitle = "💼 工作事業";
                        themeText = card.work;
                        break;
                    case "health":
                        themeTitle = "🌿 健康身心";
                        themeText = card.health;
                        break;
                    default:
                        themeTitle = "🌟 綜合運勢";
                        themeText = card.overall;
                        break;
                }

                // 構建單張牌的 HTML
                const cardHTML = `
                    <div class="card">
                        <div class="card-position">${positions[index]}</div>
                        <div class="card-title">${card.name}</div>
                        <div class="card-keywords">關鍵字：${card.keywords}</div>
                        
                        <div class="card-theme-content">
                            <strong>${themeTitle}：</strong><br>
                            ${themeText}
                        </div>
                        
                        <div class="card-advice">
                            <strong>💡 建議與行動：</strong><br>
                            ${card.advice}
                        </div>
                    </div>
                `;
                resultArea.innerHTML += cardHTML;
            });
        }
    </script>
